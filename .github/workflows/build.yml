name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Core checks and XCTest
        run: bash scripts/check.sh
      - name: Build universal Mac app
        run: bash scripts/build.sh
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: LockedIn-macOS-universal
          path: |
            dist/LockedIn-*-macOS-universal.zip
            dist/SHA256SUMS.txt
